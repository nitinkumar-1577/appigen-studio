                - article [ref=f1e222]:
                  - generic [ref=f1e223]: AppiGen
                  - text: "Implementation plan — game for casual gaming (complex) Requirements: - Build a polished, fully playable Ludo game against the computer (single player vs 3 CPU opponents). - Create a classic 4-color Ludo board with four tokens per player, clear safe squares and home lanes, dice roll button with visible die result, turn indicator, and move animations. - Follow standard rules: a 6 is required to leave base, rolling a 6 grants another turn, exact roll is required to finish, landing on an opponent sends their token back to base except on safe squares, and show win state. - CPU players should take legal turns automatically. - Make all controls functional and responsive. - Do not use placeholder controls. Roadmap: 1. Identify the requested user flows and edge cases 2. Create the app shell, screen, reusable UI, and app-specific styles 3. Separate meaningful state and domain rules into focused modules 4. Validate the complete project before preview and save Planned files: - src/App.tsx — Application shell and entry point - src/pages/MainPage.tsx — Primary screen composition - src/components/MainView.tsx — Reusable screen UI - src/styles.css — Responsive app-specific design system - src/components/GameBoard.tsx — Render the Ludo playfield and visible game state - src/components/GameControls.tsx — Expose the requested player controls and turn/status feedback - src/hooks/useLudo.ts — Manage Ludo state transitions and player/computer turns - src/lib/ludo-rules.ts — Implement and validate Ludo domain rules independently of the UI"
