<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppiGen — AI Application Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" id="fav" href="data:,">
<style>
:root{--bg:hsl(222 30% 7%);--side:hsl(222 32% 6%);--card:hsl(222 28% 10% / .72);--hov:hsl(222 24% 15%);--line:hsl(222 20% 17%);--text:hsl(220 20% 96%);--mut:hsl(220 12% 62%);--acc:hsl(258 90% 66%);--acc2:hsl(280 88% 70%);--ok:hsl(150 55% 48%);--warn:hsl(40 90% 60%);--bad:hsl(0 75% 60%);--code:hsl(222 32% 5%);--glow:0 0 40px hsl(258 90% 66% / .35);--gl:hsl(258 90% 66% / .18);--ease:all .3s cubic-bezier(.4,0,.2,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f4f9;--side:#fff;--card:rgba(0,0,0,.035);--hov:rgba(0,0,0,.07);--line:rgba(0,0,0,.1);--text:#15151d;--mut:#6a6a7e;--code:#f1f1f7;--glow:0 0 24px rgba(124,108,255,.16);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(60% 60% at 50% 0%,var(--gl),transparent 70%) fixed,var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){background:var(--hov)}button:active:not(:disabled){transform:scale(.98)}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}[hidden]{display:none!important}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
select{width:auto}input[type=checkbox]{width:auto}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:600;box-shadow:var(--glow)}.primary:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ib{padding:6px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;color:var(--mut)}.ib:hover{color:var(--text)}
.danger{color:var(--bad)}.sm{padding:4px 9px;font-size:12px}.grow{flex:1}.mut{color:var(--mut)}.row{display:flex;gap:8px;align-items:center}
#app{display:flex;height:100%}
#side{width:252px;background:var(--side);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;transition:width .2s}
#side.min{width:62px;padding:12px 8px}#side.min .t,#side.min .sec,#side.min #projects,#side.min #agents,#side.min .search,#side.min .acct span:last-child{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}.gt{background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}.brand .grow{min-width:0}
.full{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card)}.search input{border:0;background:transparent;padding:8px 2px}.search input:focus-visible{outline:0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin-top:10px}
.proj{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:transparent;border-color:transparent;padding:7px 10px}.proj small{color:var(--mut);font-size:11.5px}
.proj.on{background:var(--hov);border-color:var(--line);box-shadow:inset 3px 0 0 var(--acc)}.proj span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.5}.dot.on{background:var(--ok);opacity:1;box-shadow:0 0 8px var(--ok);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.nav{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border-color:transparent;text-align:left}
.acct{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#title{font-weight:650;font-size:15px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}.badge.busy::before{background:var(--acc);animation:pulse 1s infinite}.badge.fix::before{background:var(--warn);animation:pulse 1s infinite}.badge.bad::before{background:var(--bad)}
.badge.mode::before{display:none}#timer{font:12px ui-monospace,Menlo,monospace;color:var(--mut)}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,.85fr) 1.5fr;gap:12px;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:94%;padding:10px 13px;border-radius:14px;word-break:break-word;border:1px solid var(--line);background:var(--card)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;white-space:pre-wrap}
.msg.assistant::before{content:"Appigen";display:block;font-size:11px;font-weight:700;color:var(--acc);margin-bottom:2px}
.msg p{margin:.3em 0}.msg h3,.msg h4,.msg h5{margin:.6em 0 .2em}.msg ul,.msg ol{margin:.3em 0;padding-left:1.3em}
.msg code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:5px}
.cb{margin:8px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}.ch{display:flex;justify-content:space-between;align-items:center;padding:3px 6px 3px 10px;font-size:11.5px;color:var(--mut);border-bottom:1px solid var(--line)}
pre{margin:0;padding:10px;overflow:auto;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:2}
.step{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--mut);border-left:2px solid var(--acc);padding:1px 8px;word-break:break-all}.step.bad{border-color:var(--bad)}
.sys{align-self:center;color:var(--mut);font-size:12.5px;text-align:center;max-width:92%}
.plancard{border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:var(--card);font-size:13px}.plancard ol{margin:4px 0 0;padding-left:1.3em}
.hero{margin:auto;text-align:center;max-width:340px;color:var(--mut)}.hero h2{color:var(--text);margin:10px 0 6px;font-size:19px}
.composer{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.composer textarea{resize:none;border-radius:16px;padding:12px 14px;border-color:color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 0 24px color-mix(in srgb,var(--acc) 28%,transparent)}.composer textarea:focus-visible{outline:0;border-color:var(--acc);box-shadow:var(--glow)}
.chips{display:flex;gap:6px;overflow:auto}.chip{white-space:nowrap;font-size:12px;padding:4px 11px;border-radius:99px;color:var(--mut)}
.warn{background:rgba(251,191,36,.14);color:var(--warn);padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tab{border-color:transparent;background:transparent;color:var(--mut);display:inline-flex;gap:6px;align-items:center}.tab.on{color:var(--text);background:var(--hov);border-color:var(--line)}
.pane{display:none;flex:1;min-height:0;flex-direction:column;gap:8px;padding:10px;overflow:auto}.pane.on{display:flex}
#stage{flex:1;min-height:260px;display:flex;justify-content:center;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:auto}
#frame{height:100%;min-height:260px;width:100%;max-width:100%;border:0;border-radius:8px;background:#fff;transition:width .25s}
.errbox{display:flex;align-items:center;gap:10px;background:rgba(248,113,113,.14);color:var(--bad);padding:8px 10px;border-radius:10px;font-size:13px}.errbox span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.errbox button{margin-left:auto;flex:none}
.seg button.on{border-color:var(--acc);color:var(--acc)}
.code-wrap{flex:1;min-height:0;display:grid;grid-template-columns:170px 1fr;gap:8px}.tree{display:flex;flex-direction:column;gap:2px;overflow:auto}
.f{display:flex;gap:6px;align-items:center;text-align:left;background:transparent;border-color:transparent;padding:5px 8px;font-size:13px}.f.on{background:var(--hov);color:var(--acc)}
.view{position:relative;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--code);overflow:hidden}.view pre,.view textarea{flex:1;margin:0;border:0;border-radius:0;background:transparent;resize:none;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.k{color:#c792ea}.s{color:#a5e075}.c{color:#6b7280;font-style:italic}.n{color:#f78c6c}.g{color:#7dcfff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card)}.stat small{display:block;color:var(--mut);font-size:11.5px}.stat b{font-size:14px}
.meter{height:8px;border-radius:99px;background:var(--hov);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
.h{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:8px 0 2px}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;background:var(--card)}.li.bad{border-color:var(--bad)}.li span{min-width:0;word-break:break-word}
.pstep{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.pstep i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;flex:none;border:1px solid var(--line);color:var(--mut)}
.pstep.active{border-color:var(--acc);box-shadow:var(--glow)}.pstep.active i{background:var(--acc);color:#fff;border:0}.pstep.done i{background:var(--ok);color:#06281c;border:0}.pstep.failed i{background:var(--bad);color:#fff;border:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{width:min(420px,100%);background:var(--side);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--glow)}.mh{display:flex;justify-content:space-between;align-items:center}.mf{display:flex;gap:8px;justify-content:flex-end}.fld{display:flex;flex-direction:column;gap:4px;font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
#pages{flex:1;min-height:0;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}.ph h2{margin:0 0 2px}.ph p{margin:0}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.pc{padding:14px;gap:8px}.tcard{padding:14px;gap:8px}.tcard b,.pc b{font-size:15px}.cats{display:flex;gap:6px;flex-wrap:wrap}.cats button.on{border-color:var(--acc);color:var(--acc)}
.navl{display:flex;flex-direction:column;gap:2px;margin-top:4px}.nav.on{background:var(--hov);border-color:var(--line);color:var(--acc)}
.bellw{position:relative}.bdot{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.bpanel{position:absolute;right:0;top:38px;width:min(340px,86vw);max-height:60vh;overflow:auto;padding:10px;z-index:15;gap:6px;background:var(--side)}.li.unread{border-color:var(--acc)}
.mbox{max-height:90vh;overflow:auto}
[data-density="compact"] body{font-size:13px;line-height:1.35}[data-density="compact"] .msg{padding:6px 10px}[data-density="compact"] .pane{padding:6px}[data-density="compact"] button{padding:4px 9px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}::-webkit-scrollbar-thumb:hover{background:var(--acc)}
body{-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{border-radius:12px;transition:var(--ease)}.sm{border-radius:10px}
.brand,h2,h3,#title,.stat b,.hero h2,.ph h2,.tcard b,.pc b{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
pre,code,.step,#timer,#editor,.view pre,.view textarea,.msg code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.card{backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 hsl(220 30% 100% / .04),0 10px 30px -15px #000}
.mbox{background:color-mix(in srgb,var(--side) 88%,transparent);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border-radius:16px;box-shadow:0 20px 60px -20px #000}
.msg,.pstep,.plancard,.stat,.pc,.tcard,.li,.sys,.step,#pages>*{animation:fi .4s ease-out}
.lg{width:36px;height:36px;padding:0;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:var(--glow);display:grid;place-items:center;flex:none}.lg svg{width:18px;height:18px;stroke:#fff;stroke-width:2.5}.lg:hover:not(:disabled){filter:brightness(1.1);background:linear-gradient(135deg,var(--acc),var(--acc2))}
.brand{font-size:18px;letter-spacing:-.3px}
.nav{border-radius:12px;padding:9px 12px}.nav.on{color:var(--text);box-shadow:inset 0 1px 0 hsl(220 30% 100% / .04),0 10px 30px -15px #000}.nav.on svg{color:var(--acc)}.nav.on::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:var(--glow)}
.primary,.primary:hover:not(:disabled){background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sw{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}.swb{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid transparent}.swb:hover{transform:scale(1.1)}.swb.on{border-color:var(--text);box-shadow:var(--glow);transform:scale(1.1)}
#burger{display:none}
:root[data-theme="light"]{--bg:hsl(220 20% 97%);--side:#fff;--card:hsl(0 0% 100% / .75);--hov:hsl(220 20% 93%);--line:hsl(220 15% 87%);--text:hsl(222 30% 12%);--mut:hsl(220 10% 42%);--code:hsl(220 20% 95%)}
@media(max-width:900px){body{overflow:auto}html,body{height:auto}#app{height:auto;min-height:100%}#grid{grid-template-columns:1fr}#side{position:fixed;inset:0 auto 0 0;z-index:40;width:264px;transform:translateX(-100%);box-shadow:20px 0 60px -20px #000}#side.open{transform:none}#bd{position:fixed;inset:0;background:hsl(222 30% 4% / .7);backdrop-filter:blur(4px);z-index:39}#burger{display:inline-flex!important}.card{min-height:72vh}.code-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div id="bd" hidden></div>
<aside id="side" aria-label="Sidebar">
  <div class="brand"><button id="logo" class="lg" aria-label="Go to Studio"></button><span class="t grow">AppiGen</span><button id="collapse" class="ib" aria-label="Collapse sidebar" title="Collapse sidebar" data-i="panel"></button></div>
  <button id="newp" class="primary full"><i data-i="plus"></i><span class="t">New Project</span></button>
  <label class="search"><i data-i="search"></i><input id="q" placeholder="Search projects, files, chats" aria-label="Global search"></label>
  <nav class="navl" id="nav" aria-label="Main">
    <button class="nav on" data-v="studio"><i data-i="spark"></i><span class="t">Studio</span></button>
    <button class="nav" data-v="dashboard"><i data-i="dash"></i><span class="t">Dashboard</span></button>
    <button class="nav" data-v="apps"><i data-i="apps"></i><span class="t">My Apps</span></button>
    <button class="nav" data-v="templates"><i data-i="tpl"></i><span class="t">Templates</span></button>
  </nav>
  <div class="sec">Recent projects</div><div id="projects"></div>
  <div class="sec">My Agents</div><div id="agents"></div>
  <div class="grow"></div>
  <div class="sw t" id="sw"><span>Accent</span></div>
  <button id="openset" class="nav"><i data-i="gear"></i><span class="t">Settings</span></button>
  <button class="acct nav" id="acctbtn" title="Workspace settings"><span class="av">G</span><span>Guest workspace</span></button>
</aside>
<main>
  <header>
    <button id="burger" class="ib" aria-label="Open menu" data-i="panel"></button><b id="title">Untitled project</b>
    <button id="ren" class="ib" aria-label="Rename project" title="Rename project" data-i="edit"></button>
    <button id="delp" class="ib" aria-label="Delete project" title="Delete project" data-i="trash"></button>
    <span id="status" class="badge">Ready</span><span id="mode" class="badge mode">Chat mode</span><span id="timer">00:00</span>
    <div class="grow"></div>
    <button id="undo" class="sm row"><i data-i="undo"></i>Undo</button>
    <button id="export" class="sm row"><i data-i="download"></i>Export</button><button id="zip" class="sm row"><i data-i="download"></i>ZIP</button><div class="bellw"><button id="bell" class="ib" aria-label="Notifications" title="Notifications"><i data-i="bell"></i><span id="bdot" class="bdot" hidden></span></button><div id="bpanel" class="bpanel card" hidden></div></div>
    <button id="theme" class="ib" aria-label="Toggle theme" title="Toggle theme" data-i="moon"></button>
    <button id="openset2" class="ib" aria-label="Settings" title="Settings" data-i="gear"></button>
  </header>
  <div id="warn" class="warn" hidden><span id="warnt"></span><button id="retry" class="sm" hidden>Retry</button><button id="gset" class="sm" hidden>Open Settings</button></div>
  <div id="pages" hidden></div>
  <div id="grid">
    <section class="card" aria-label="Agent chat">
      <div id="chat" aria-live="polite"></div>
      <div class="composer">
        <div class="chips">
          <button class="chip" data-p="Build a snake game with keyboard controls, score and restart">Snake Game</button>
          <button class="chip" data-p="Build a calculator with addition, subtraction, multiplication and division">Calculator</button>
          <button class="chip" data-p="Build a portfolio website for a product designer with projects and a contact form">Portfolio Website</button>
          <button class="chip" data-p="Build a recipe app where I can add recipes, search and mark favorites">Recipe App</button>
          <button class="chip" data-p="Build an expense tracker with categories, totals and a chart">Expense Tracker</button>
          <button class="chip" data-p="What can you build, and how do you work?">Ask a question</button>
          <button class="chip" id="stress" title="Builds 5 large apps one after another and reports PASS or FAIL">▶ Run 5 stress tests</button>
        </div>
        <textarea id="input" rows="2" placeholder="Ask anything, or describe the app you want to build…" aria-label="Message Appigen"></textarea>
        <div class="row"><span class="mut" style="font-size:12px">Enter to send · Shift+Enter for a new line</span><div class="grow"></div><button id="stop" class="sm" disabled>Stop</button><button id="send" class="primary row"><i data-i="send"></i>Send</button></div>
      </div>
    </section>
    <section class="card" aria-label="Workspace">
      <nav class="tabs">
        <button class="tab on" data-s="preview"><i data-i="monitor"></i>Preview</button>
        <button class="tab" data-s="plan"><i data-i="check"></i>Plan</button>
        <button class="tab" data-s="code"><i data-i="file"></i>Code</button>
        <button class="tab" data-s="act"><i data-i="bot"></i>Intelligence</button>
      </nav>

const applyLook=()=>{const d=document.documentElement,c=S.cfg,t=c.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):c.theme,h=HUE[c.accent]||258,s=d.style;d.dataset.theme=t;d.dataset.density=c.density;s.setProperty('--acc','hsl('+h+' 90% 66%)');s.setProperty('--acc2','hsl('+((h+22)%360)+' 88% 70%)');s.setProperty('--glow','0 0 40px hsl('+h+' 90% 66% / .35)');s.setProperty('--gl','hsl('+h+' 90% 66% / '+(t==='light'?.1:.18)+')')};
const NK='appigen.notifications';let notes=[];try{notes=JSON.parse(localStorage.getItem(NK)||'[]')}catch(e){}
const saveN=()=>{try{localStorage.setItem(NK,JSON.stringify(notes))}catch(e){}};
const renderBell=()=>{const u=notes.filter(n=>!n.read).length,p=$('bpanel');$('bdot').hidden=!u;$('bdot').textContent=u>9?'9+':String(u);p.replaceChildren();const h=el('div','row');h.append(el('b','grow','Notifications'));
const m=el('button','sm','Mark all read');m.onclick=()=>{notes.forEach(n=>{n.read=true});saveN();renderBell()};const c=el('button','sm','Clear');c.onclick=()=>{notes=[];saveN();renderBell()};h.append(m,c);p.append(h);
if(!notes.length)p.append(el('div','sys','No notifications yet. Build and export events appear here.'));notes.forEach(n=>p.append(el('div','li'+(n.read?'':' unread'),n.title+' \u2014 '+n.desc+' \u00b7 '+ago(n.at))))};
const notify=(kind,title,desc)=>{notes.unshift({id:uid(),kind,title,desc,read:false,at:Date.now()});notes=notes.slice(0,30);saveN();renderBell()};
$('bell').onclick=()=>{const p=$('bpanel');p.hidden=!p.hidden;renderBell()};document.addEventListener('click',e=>{if(!e.target.closest('.bellw'))$('bpanel').hidden=true});
const loadZip=()=>window.JSZip?Promise.resolve(window.JSZip):new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>res(window.JSZip);s.onerror=()=>rej(new Error('Could not load the ZIP library'));document.head.append(s)});
const zip=async p=>{if(!Object.keys(p.files).length)return toast('Nothing to export yet');try{const Z=await loadZip(),z=new Z();Object.entries(p.files).forEach(([n,c])=>z.file(n,c));z.file('README.txt','Exported from Appigen.\nOpen index.html in a browser to run the app.\n');
const blob=await z.generateAsync({type:'blob'}),name=(p.name.replace(/[^\w-]+/g,'-')||'app')+'.zip',dl=await dlP;if(dl)await dl.save({filename:name,data:blob});else{const a=el('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}notify('system','ZIP exported',name);toast('ZIP ready')}
catch(e){toast(e&&e.code==='declined'?'Export cancelled':'ZIP export failed: '+((e&&e.message)||(e&&e.code)||'error'))}};
$('zip').onclick=()=>zip(cur());
const page=(t,s)=>{const b=$('pages');b.replaceChildren();const h=el('div','ph');h.append(el('h2','',t),el('p','mut',s));b.append(h);return b};
const goto=v=>{view=v;$('grid').hidden=v!=='studio';$('pages').hidden=v==='studio';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('bpanel').hidden=true;if(v!=='studio')renderPage()};
const openProject=id=>{switchTo(id);goto('studio')};
const dashboard=()=>{const b=page('Dashboard','A live overview computed from your own projects.'),ps=S.projects,week=Date.now()-6048e5,builds=ps.reduce((a,p)=>a+(p.builds||0),0),ms=ps.reduce((a,p)=>a+(p.buildMs||0),0),built=ps.filter(p=>Object.keys(p.files).length),st=el('div','stats');
[['Apps created',built.length+' ('+built.filter(p=>p.created>week).length+' new this week)'],['Files generated',ps.reduce((a,p)=>a+Object.keys(p.files).length,0)],['Builds run',builds],['Avg. build time',builds?Math.round(ms/builds/1000)+'s':'No builds yet'],['AI engine',window.claude?'Claude (built-in)':'Gemini (your key)']].forEach(([a,c])=>{const s=el('div','stat');s.append(el('small','',a),el('b','',String(c)));st.append(s)});b.append(st,el('div','h','Recent apps'));
const l=el('div','tree');ps.slice().sort((x,y)=>y.updated-x.updated).slice(0,5).forEach(p=>{const r=el('div','li'),o=el('button','sm','Open');o.onclick=()=>openProject(p.id);r.append(el('span','',p.name+' \u00b7 '+Object.keys(p.files).length+' files \u00b7 '+ago(p.updated)),o);l.append(r)});b.append(l,el('div','h','Quick actions'));
const q=el('div','row');[['Open Studio','studio'],['Browse Templates','templates'],['Manage Apps','apps']].forEach(([t,v])=>{const x=el('button','',t);x.onclick=()=>goto(v);q.append(x)});b.append(q)};
const apps=()=>{const b=page('My Apps','Open, rename, duplicate, export or delete your projects.'),bar=el('div','row'),q=el('input'),so=el('select'),nb=el('button','primary','New project'),g=el('div','agrid');q.placeholder='Search projects\u2026';q.value=aq;
[['new','Newest'],['old','Oldest'],['name','Name']].forEach(([v,l])=>{const o=el('option','',l);o.value=v;so.append(o)});so.value=asort;nb.onclick=()=>$('newp').click();bar.append(q,so,nb);b.append(bar,g);
const grid=()=>{g.replaceChildren();const l=S.projects.filter(p=>!aq||(p.name+' '+Object.keys(p.files).join(' ')).toLowerCase().includes(aq.toLowerCase()));l.sort((x,y)=>asort==='name'?x.name.localeCompare(y.name):asort==='old'?x.created-y.created:y.created-x.created);if(!l.length)g.append(el('div','sys','No projects match your search.'));
l.forEach(p=>{const c=el('div','card pc'),r=el('div','row');c.append(el('b','',p.name),el('small','mut',Object.keys(p.files).length+' files \u00b7 created '+ago(p.created)+' \u00b7 '+(p.builds||0)+' builds'));r.style.flexWrap='wrap';
[['Open',()=>openProject(p.id)],['Rename',async()=>{const v=await ask('Rename project','',{input:true,def:p.name,ok:'Save'});if(v){p.name=v.slice(0,60);p.autoNamed=true;persist();renderAll();grid()}}],['Duplicate',()=>{const d=Object.assign(clone(p),{id:uid(),name:p.name+' copy',created:Date.now(),updated:Date.now()});S.projects.push(d);persist();renderProjects();grid();notify('system','Project duplicated',d.name)}],['ZIP',()=>zip(p)],
['Delete',async()=>{if(busy)return toast('Wait for the current build to finish');if(!(await ask('Delete project','Delete "'+p.name+'" and all of its files? This cannot be undone.',{ok:'Delete',danger:true})))return;S.projects=S.projects.filter(x=>x!==p);if(!S.projects.length)S.projects.push(newProject('Untitled project'));if(S.activeId===p.id){S.activeId=S.projects[0].id;active=null}persist();renderChat();refresh();grid()}]].forEach(([t,f])=>{const x=el('button','sm'+(t==='Delete'?' danger':''),t);x.onclick=f;r.append(x)});c.append(r);g.append(c)})};
q.oninput=()=>{aq=q.value;grid()};so.onchange=()=>{asort=so.value;grid()};grid()};
const TPL=[['E-commerce Storefront','E-commerce','Product grid, cart and checkout flow.','Build an e-commerce storefront with a product grid, category filter, search, a cart with quantity controls and totals, and a checkout form with validation'],
['Chatbot Assistant','AI','Chat UI with message history.','Build a chat assistant interface with message history, a typing indicator, suggested prompts, simple scripted replies and a clear conversation button'],
['Portfolio','Personal','Minimal hero, projects grid, contact form.','Build a minimal portfolio website with a hero section, a filterable projects grid, an about section and a contact form with validation'],
['Analytics Dashboard','Productivity','Charts, KPIs and filterable tables.','Build an analytics dashboard with KPI cards, a line chart and a bar chart drawn on canvas, and a sortable, filterable data table'],
['Booking Calendar','Productivity','Event scheduling with time slots.','Build a booking calendar with a month view, selectable time slots, a booking form and a list of upcoming bookings with cancel'],
['Music Player','Personal','Playlist UI with playback controls.','Build a music player interface with a playlist, play, pause, next, previous, a progress bar, volume, shuffle and repeat, using short generated tones as audio']];
const templates=()=>{const b=page('Templates','Start from a ready-made idea. A template fills the chat box; you press Send to build it.'),cats=['All',...new Set(TPL.map(t=>t[1]))],bar=el('div','cats'),g=el('div','agrid');
cats.forEach(c=>{const x=el('button','sm'+(c===tcat?' on':''),c);x.onclick=()=>{tcat=c;templates()};bar.append(x)});b.append(bar,g);
TPL.filter(t=>tcat==='All'||t[1]===tcat).forEach(t=>{const c=el('div','card tcard'),u=el('button','primary sm','Use template');u.onclick=()=>{goto('studio');$('input').value=t[3];$('input').focus();toast('Template loaded. Press Send to build it.')};c.append(el('b','',t[0]),el('small','mut',t[1]),el('span','',t[2]),u);g.append(c)})};
const renderPage=()=>{({dashboard,apps,templates})[view]()};
document.querySelectorAll('#nav button').forEach(b=>{b.onclick=()=>goto(b.dataset.v)});$('acctbtn').onclick=()=>settings();
const drawer=o=>{$('side').classList.toggle('open',o);$('bd').hidden=!o};$('burger').onclick=()=>drawer(true);$('bd').onclick=()=>drawer(false);
$('side').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.id!=='collapse')drawer(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)$('mx').click();else{$('bpanel').hidden=true;drawer(false)}}});
const mark=()=>document.querySelectorAll('#sw .swb').forEach((b,i)=>b.classList.toggle('on',Object.keys(HUE)[i]===S.cfg.accent));
Object.entries(HUE).forEach(([k,hu])=>{const b=el('button','swb');b.style.background='hsl('+hu+' 90% 66%)';b.title=k[0].toUpperCase()+k.slice(1);b.setAttribute('aria-label','Use '+k+' accent');b.onclick=()=>{S.cfg.accent=k;persist();applyLook();mark()};$('sw').append(b)});
$('logo').onclick=()=>goto('studio');
let usedStep=false,planned=false,lastOk=true,lastTools=false,haltStages=false;
function pending(p){return(p.plan?p.plan.steps:[]).filter(s=>s.s!=='done')}
const settle=async()=>{let q=0;while(q<3500&&!haltStages){await new Promise(r=>setTimeout(r,250));q=busy?0:q+250}};
async function stages(p,force){if(!force&&!(planned&&lastOk&&lastTools))return;let ran=0;
const lim=force?Math.max(S.cfg.stages,5):S.cfg.stages;for(let k=2;k<=lim+1&&!haltStages;k++){if(!pending(p).length||!lastOk||cur()!==p)break;await settle();if(haltStages||cur()!==p)break;const n=pending(p).length;if(!n)break;fixes=0;
await run('Continue with the next stage. Unfinished plan steps: '+pending(p).map(s=>s.t).join(' | ')+'. Implement the next one or two steps completely, mark them with update_step, then run check_project. Do not call plan again.','stage',k);ran++;
if(!lastTools||pending(p).length>=n){if(lastOk&&lastTools)notify('system','Staged build paused',p.name+' \u00b7 no progress in stage '+k);break}}
if(ran){const t=p.plan?p.plan.steps.length:0,d=t-pending(p).length;notify('build','Staged build '+(pending(p).length?'paused':'finished'),p.name+' \u00b7 '+d+' of '+t+' steps complete');renderPlan()}}
$('stop').addEventListener('click',()=>{haltStages=true});
applyLook();mark();renderBell();goto('studio');
renderChat();refresh();setMode('chat');
$('retry').onclick=async()=>{sampleP=probe();await check()};$('gset').onclick=settings;check();
dlP.then(d=>{$('export').disabled=!d&&!!window.claude});
})();
